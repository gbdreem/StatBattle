name: Bug
description: Something broken or hard to use
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The page or game, and the address if you have it.
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: input
    id: device
    attributes:
      label: Browser and device
