<html lang="en">
<head>
<meta charset="utf-8">

<title>Gridiron Cap Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE occasion: draft night in a front office, lively but orderly
   IDEA the war-room big board under a striped turf field, then a playoff bracket on the scoreboard
   PICTURE the live draft board (draft), the depth chart with unit grades (review), the bracket (playoffs)
   COLOUR white or near-black ground, mowed-turf green band with yard lines, end-zone red accent, team colours
   TYPE Barlow Condensed 800 for names and numbers + Barlow for text
   LAYOUT laptop: clock bar, board 2fr beside rosters 1fr; phone: clock, board, rosters stacked */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--ink:light-dark(#15171a,#eef0f2);--mut:light-dark(#5b616b,#9aa1ab);--pan:light-dark(#f4f4f2,#1b1e23);--line:light-dark(#e3e3df,#2c3038);--or:#c8102e;--orx:light-dark(#a30d25,#ff7d8e)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(34px,5vw,52px);font-weight:800;text-wrap:balance}
h2{font-size:28px;font-weight:800}
h3{font-size:20px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px)}
.wood{background:repeating-linear-gradient(90deg,#2e7d3a 0 70px,rgba(255,255,255,.5) 70px 72px,#358a42 72px 142px,rgba(255,255,255,.5) 142px 144px);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);padding:14px max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;border-bottom:4px solid var(--or)}
.wood .brand{font:800 26px/1 "Barlow Condensed",sans-serif;display:flex;align-items:center;gap:10px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font:700 15px/1 "Barlow Condensed",sans-serif;padding:7px 11px;border-radius:99px;background:rgba(0,0,0,.28);text-shadow:none}
.steps span.on{background:#fff;color:#1d5a27}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:0;background:var(--or);color:#fff;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.fine{font-size:13px;color:var(--mut)}
.ovr{display:inline-grid;place-items:center;min-width:40px;height:34px;border-radius:8px;font:800 20px/1 "Barlow Condensed",sans-serif;color:#fff;background:#6b7280}
.o95{background:#8f0b21}.o90{background:#c8102e}.o85{background:#2457c5}.o80{background:#3f7d58}.o75{background:#6b7280}.o60{background:#9ca3af}
.pos{display:inline-block;min-width:22px;text-align:center;font:700 13px/20px "Barlow Condensed",sans-serif;border-radius:5px;background:var(--pan);border:1px solid var(--line);color:var(--mut)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:start}
.lede{font-size:17px;max-width:60ch;margin:12px 0 20px}
.field{margin:0 0 16px;border:0;padding:0}
.field legend,.field label.l{display:block;font-weight:700;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;min-height:44px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--pan);font-weight:600}
.seg span small{display:block;font-size:13px;font-weight:500;color:var(--mut)}
.seg input:checked+span{border-color:var(--or);background:color-mix(in srgb,var(--or) 12%,var(--bg))}
.seg input:focus-visible+span{outline:3px solid var(--or)}
.txt{min-height:44px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;width:100%;max-width:320px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:14px;padding:12px;background:linear-gradient(160deg,var(--pan),var(--bg));border:1px solid var(--line);display:grid;gap:6px}
.card .nm{font:800 21px/1 "Barlow Condensed",sans-serif}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 6px;font-size:13px;color:var(--mut);align-items:center}
.bars i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bars i b{display:block;height:100%;background:var(--or)}
/* draft */
.clock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 24px;align-items:center;background:var(--pan);border-bottom:1px solid var(--line)}
.clk{font:800 clamp(40px,6vw,64px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:2.2ch;text-align:center}
.clk.low{color:var(--orx)}
.otc .who{font:800 26px/1.05 "Barlow Condensed",sans-serif}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mine{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:flex-end}
.stat b{display:block;font:800 22px/1 "Barlow Condensed",sans-serif}
.stat{font-size:13px;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.chip{min-height:40px;padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tools .txt{max-width:220px;min-height:40px}
.tools select{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:6px 10px;font-size:16px}
.scroll{overflow-x:auto}
.boardwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--pan);font-size:13px;font-weight:700;color:var(--mut);text-align:left;padding:8px 6px;z-index:1;white-space:nowrap}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
tr.no td{opacity:.55}
td .pn{font-weight:700;line-height:1.15}
td .sub{font-size:13px;color:var(--mut);white-space:nowrap}
.dr{min-height:36px;padding:6px 12px;border-radius:8px;border:0;background:var(--or);color:#fff;font-weight:700;white-space:nowrap}
.dr:disabled{background:transparent;color:var(--mut);font-weight:500;font-size:13px;cursor:default;padding:6px 0}
.teams{display:grid;gap:12px}
.team{border:1px solid var(--line);border-radius:12px;padding:12px;border-top:5px solid var(--c)}
.team.now{box-shadow:0 0 0 2px var(--c)}
.team h3{display:flex;justify-content:space-between;gap:8px}
.budget{height:8px;border-radius:4px;background:var(--line);margin:8px 0 4px;overflow:hidden}
.budget b{display:block;height:100%;background:var(--c)}
.ros{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:14px}
.ros li{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:6px;align-items:center}
.ros li.empty{color:var(--mut);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;display:block;font-size:13px}
.ros .o{font:800 16px/1 "Barlow Condensed",sans-serif}
.log{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.log div{flex:none;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:6px 10px;font-size:14px}
/* lineup + tourney */
.lgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);width:100%;text-align:left;min-height:52px}
.slot.st{border-color:var(--or);background:color-mix(in srgb,var(--or) 9%,var(--bg))}
.slots{display:grid;gap:6px}
.tag{font-size:13px;font-weight:700;color:var(--orx);white-space:nowrap}
.seedrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);gap:0 28px;align-items:center;background:light-dark(#1d2027,#0b0c0f);color:#eef0f2;border-radius:16px;padding:clamp(16px,3vw,28px)}
.col{display:grid;gap:22px}
.ser{background:#2a2e37;border-radius:10px;overflow:hidden;position:relative}
.ser .tm{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 12px;border-left:5px solid var(--c)}
.ser .tm+.tm{border-top:1px solid #3a3f4a}
.ser .tm.out{opacity:.45}
.ser .w{font:800 24px/1 "Barlow Condensed",sans-serif}
.ser .tn{font:700 18px/1.1 "Barlow Condensed",sans-serif}
.ser .sd{font-size:13px;color:#9aa1ab}
.champ{text-align:center;display:grid;gap:6px;justify-items:center}
.trophy{width:84px;height:110px}
.games{font-size:13px;color:#9aa1ab;padding:4px 12px 8px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.final{font:800 clamp(28px,4vw,40px)/1 "Barlow Condensed",sans-serif;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}.chips .chip{flex:none}
.ugrid{display:grid;grid-template-columns:minmax(0,9em) repeat(4,minmax(0,1fr));gap:8px 12px;align-items:center;font-size:14px}
.ugrid .h{font-weight:700;color:var(--mut);font-size:13px}
.ub{display:flex;align-items:center;gap:6px}.ub i{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}.ub i b{display:block;height:100%;background:var(--c)}.ub span{font:700 15px/1 "Barlow Condensed",sans-serif;min-width:2.2ch;text-align:right}
.ros li.slotopen{display:grid;grid-template-columns:34px minmax(0,1fr);color:var(--mut);font-size:13px}
.ros li.slotopen span:last-child{border-bottom:1px dashed var(--line)}
.ros li .pos{min-width:30px}
.ros li{grid-template-columns:34px minmax(0,1fr) auto auto}
.bline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.bline .fine{white-space:nowrap}
.clock.fb{grid-template-columns:auto minmax(16em,1fr) minmax(0,1.3fr)}
.needs b{font-size:18px;line-height:1.15}
@media(max-width:900px){.dgrid,.lgrid{grid-template-columns:minmax(0,1fr)}.teams{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.boardwrap{max-height:none}}
@media(max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}.bk{grid-template-columns:minmax(0,1fr)}.col{gap:12px}.champ{padding-top:16px}.box{grid-template-columns:minmax(0,1fr)}.clock{grid-template-columns:auto minmax(0,1fr)}.mine{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:600px){.ugrid{grid-template-columns:minmax(0,6.5em) repeat(4,minmax(0,1fr));font-size:13px}.ub i{display:none}.hide-s{display:none}table{font-size:14px}td,th{padding:6px 4px}td .sub{white-space:normal}.ovr{min-width:34px;height:30px;font-size:18px}.dr{padding:6px 10px}.dr:disabled{white-space:normal;max-width:6em;text-align:right}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 1s ease-in-out infinite alternate}@keyframes p{from{opacity:1}to{opacity:.55}}}
</style>

  list.sort(so);
  if(!list.length)return `<tr><td colspan="4" class="fine" style="padding:16px">No available players match.</td></tr>`;
  return list.map(p=>{const w=why(me,p);return `<tr class="${w?'no':''}"><td>${ovr(p)}</td><td><div class="pn">${esc(p.name)}</div><div class="sub">${pos(p)} ${line(p)}</div></td><td class="num cond" style="font-size:18px;font-weight:700">${money(p.sal)}</td><td class="num"><button class="dr" data-p="${p.id}" ${my&&!w?'':'disabled'}>${w?esc(w):my?'Draft':'Wait'}</button></td></tr>`}).join('');
}
function slotList(t){
  const out=[];
  for(const k of ORDER()){
    const have=t.ros.filter((id,j)=>t.sl[j]===k).map(getP);
    for(let j=0;j<REQ()[k];j++){const p=have[j];out.push(p?`<li><span class="pos" title="${k}">${p.pos}</span><span>${esc(p.name)}${GROUPS[k]?` <span class="fine">${k}</span>`:''}</span><span class="o">${p.ovr}</span><span class="num fine">${money(p.sal)}</span></li>`:`<li class="slotopen"><span class="pos">${k}</span><span>open</span></li>`)}
  }
  return out.join('');
}
function teamCard(t,i){
  const sp=spent(t),now=S.phase==='draft'&&S.order[S.pick]===i;
  return `<div class="team ${now?'now':''}" style="--c:${t.col}"><h3><span>${esc(t.name)}${t.human?' (you)':''}</span><span class="num">${t.ros.length}/${SLOTS()}</span></h3>
  <div class="fine">${t.human?'':esc(t.blurb)+' · '}${money(S.budget-sp)} left</div><div class="budget"><b style="width:${Math.min(100,sp/S.budget*100)}%"></b></div>
  <ul class="ros">${slotList(t)}</ul></div>`;
}
function draft(){
  const i=S.order[S.pick],t=S.teams[i],me=S.teams[S.me],my=isMine();
  const round=Math.floor(S.pick/4)+1,sl=SLOTS()-me.ros.length,nextMine=S.order.indexOf(S.me,S.pick);
  const away=nextMine<0?'':nextMine===S.pick?'You are on the clock':`Your pick in ${nextMine-S.pick}`;
  const fq=document.activeElement&&document.activeElement.id==='q';
  const op=openSlots(me);
  app.innerHTML=`<section class="band clock fb">
   <div class="clk ${my?'':'fine'}" id="clk">${my?(S.timer?S.timer:'∞'):'…'}</div>
   <div class="otc"><div class="fine">${MODES[S.mode].label} · round ${round} of ${SLOTS()} · pick ${S.pick+1} of ${S.order.length} · ${away}</div><div class="who ${my?'':'pulse'}"><span class="dot" style="background:${t.col}"></span>${my?'Your pick':esc(t.name)+' is picking'}</div></div>
   <div class="mine"><div class="stat"><b>${money(left(me))}</b>budget left</div><div class="stat"><b>${sl?money(left(me)/sl):'—'}</b>per open spot</div><div class="stat needs"><b>${needList(me).join(' · ')||'Full'}</b>still needed</div>
   ${op.length?`<span style="display:flex;gap:6px"><select id="rpos" aria-label="Replacement spot" style="min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:6px 8px;font-size:16px">${op.map(k=>`<option>${k}</option>`).join('')}</select><button class="btn ghost" id="rep" ${my?'':'disabled'} title="Adds a 60-rated player on a minimum deal">Sign replacement (${money(MIN)})</button></span>`:''}<button class="btn ghost" id="simdraft" title="Auto-picks every remaining pick, including yours">Sim to end of draft</button></div>
  </section>
  <section class="band dgrid">
   <div><div class="chips" role="group" aria-label="Filter by position">${['all','need',...modePos()].map(f=>`<button class="chip ${S.filter===f?'on':''}" data-f="${f}">${f==='all'?'All':f==='need'?'My needs':f}</button>`).join('')}</div>
    <div class="tools"><input class="txt" id="q" type="search" placeholder="Search players" value="${esc(S.q)}" aria-label="Search players">
    <select id="sort" aria-label="Sort"><option value="ovr">Best rating</option><option value="value">Best value</option><option value="cheap">Cheapest</option><option value="pricey">Most expensive</option></select></div>
    <div class="boardwrap scroll"><table><thead><tr><th>OVR</th><th>Player · 2024 stats</th><th class="num">Per year</th><th></th></tr></thead><tbody id="tb">${rows()}</tbody></table></div>
    <h3 style="margin:18px 0 8px">Latest picks</h3><div class="log">${S.log.slice(0,12).map(l=>{const p=getP(l.id),tm=S.teams[l.t];return `<div style="--c:${tm.col}"><b>#${l.n}</b> ${p.pos} ${esc(p.name)} <span class="fine">${esc(tm.name)}${l.auto?' · auto':''}</span></div>`}).join('')||'<span class="fine">No picks yet.</span>'}</div>
   </div>
   <aside class="teams">${S.teams.map(teamCard).join('')}</aside>
  </section>`;
  $('#sort').value=S.sort;
  if(fq){const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!S)return;
  if(b.dataset.p&&isMine()){const p=P[+b.dataset.p];if(!why(S.teams[S.me],p)){doPick(S.me,p);tick()}}
  else if(b.dataset.f){S.filter=b.dataset.f;$('#tb').innerHTML=rows();document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===S.filter))}
  else if(b.id==='rep'&&isMine()){doPick(S.me,null,false,$('#rpos').value);tick()}
  else if(b.id==='go'){startTourney();render();scrollTo(0,0)}
  else if(b.id==='next'){playNext();render()}
  else if(b.id==='rest'){const n=S.br.rounds.length;while(S.phase==='tourney'&&S.br.rounds.length===n)playNext();render()}
  else if(b.id==='end'){while(S.phase==='tourney')playNext();render();scrollTo(0,0)}
  else if(b.id==='simdraft'&&S.phase==='draft'){clearInterval(timerId);clearTimeout(botId);while(S.phase==='draft'){const i=S.order[S.pick],t=S.teams[i];doPick(i,choose(t,t.human?.3:undefined),t.human)}tick();scrollTo(0,0)}
  else if(b.id==='again'){S=null;render();scrollTo(0,0)}
});
app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#tb').innerHTML=rows()}});
app.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;$('#tb').innerHTML=rows()}});

/* ---------- review ---------- */
function review(){
  const U=[0,1,2,3].map(units),order=[0,1,2,3].sort((a,b)=>rating(b)-rating(a));
  const rowsU=[['Pass offense','pass'],['Run offense','run'],['Pass rush','rush'],['Coverage','cover'],['Run defense','runD']].filter(([,k])=>S.mode==='off'?['pass','run'].includes(k):S.mode==='def'?!['pass','run'].includes(k):true);
  const bar=(v,c)=>`<div class="ub" style="--c:${c}"><i><b style="width:${Math.max(0,Math.min(100,(v-70)/28*100))}%"></b></i><span>${v.toFixed(0)}</span></div>`;
  const hdr=order.map(i=>`<div class="h" style="color:${S.teams[i].col}">${esc(S.teams[i].name)}${S.teams[i].human?' (you)':''}</div>`).join('');
  app.innerHTML=`<section class="band lgrid">
  <div><h1>Draft complete. Here's how the units stack up.</h1>
   <p class="lede">Each unit grade blends the ratings of the players who matter most to it. Pass offense leans on the quarterback; pass rush on the edge rushers. Games are simulated play by play from these matchups.${S.mode==='off'?' In offense-only games, both offenses face the same stand-in defense (every player rated 89), so the better offense usually wins.':S.mode==='def'?' In defense-only games, both defenses face the same stand-in offense (every player rated 89), so the better defense usually wins.':''}</p>
   <div class="scroll"><div class="ugrid" style="min-width:420px"><div class="h">Unit</div>${hdr}
    ${rowsU.map(([l,k])=>`<div><b>${l}</b></div>${order.map(i=>bar(U[i][k],S.teams[i].col)).join('')}`).join('')}
    <div><b>Team rating</b></div>${order.map(i=>`<div class="cond" style="font-size:26px;font-weight:800">${rating(i).toFixed(1)}</div>`).join('')}
   </div></div>
   <div class="ctl"><button class="btn" id="go">Start the playoffs</button></div>
   <p class="fine">Team rating is the average player rating${S.mode==='def'?'':', with the quarterback counted three times'}. It sets the seeds: ${order.map((i,k)=>`${k+1}. ${esc(S.teams[i].name)}`).join(', ')}.</p>
  </div>
  <aside>${teamCard(S.teams[S.me],S.me)}</aside></section>
  <section class="band" style="padding-top:0"><h2 style="margin-bottom:12px">Rival rosters</h2><div class="teams" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">${S.teams.map((t,i)=>i===S.me?'':teamCard(t,i)).join('')}</div></section>`;
}

/* ---------- playoffs ---------- */
function serBox(s,lbl){
  if(!s)return `<div class="ser"><div class="tm" style="--c:#3a3f4a"><span></span><span class="sd">${lbl}</span><span></span></div><div class="tm" style="--c:#3a3f4a"><span></span><span class="sd">Waiting</span><span></span></div></div>`;
  const d=done(s),w=d?winner(s):-1;
  const tm=(i,k)=>{const t=S.teams[i];return `<div class="tm ${d&&w!==i?'out':''}" style="--c:${t.col}"><span class="sd">${S.seeds.indexOf(i)+1}</span><span class="tn">${esc(t.name)}${t.human?' (you)':''}</span><span class="w">${S.br.need===1?(s.g.length?s.g[0].sc[k]:''):s.w[k]}</span></div>`};
  const gl=S.br.need===1?(s.g.length?(s.g[0].ot?'Final · OT':'Final'):lbl):(s.g.length?s.g.map((g,j)=>`G${j+1} ${g.sc[0]}–${g.sc[1]}${g.ot?' OT':''}`).join(' · '):lbl);
  return `<div class="ser">${tm(s.a,0)}${tm(s.b,1)}<div class="games">${gl}</div></div>`;
}
function boxCol(g,k){
  const t=S.teams[g.t[k]],b=g.box[k];
  const n=x=>esc(x.p.name);
  const qb=b.filter(x=>x.s.att),rb=b.filter(x=>x.s.car),rc=b.filter(x=>x.s.rec).sort((x,y)=>y.s.yds-x.s.yds),df=b.filter(x=>x.s.sk||x.s.pi||x.s.tk).sort((x,y)=>(y.s.sk*3+y.s.pi*3+y.s.tk)-(x.s.sk*3+x.s.pi*3+x.s.tk));
  const L=(a,c)=>`<div class="bline"><span>${a}</span><span class="fine num">${c}</span></div>`;
  return `<div><h3 style="margin-bottom:6px"><span class="dot" style="background:${t.col}"></span>${esc(t.name)}</h3>
   ${L(S.mode==='def'?'Yards allowed':'Total yards',`<b>${S.mode==='def'?g.ty[1-k]:g.ty[k]}</b>`)}
   ${qb.map(x=>L(`${n(x)} <span class="fine">passing</span>`,`${x.s.cmp}/${x.s.att} · ${x.s.py} yds · ${x.s.ptd} TD · ${x.s.int} INT`)).join('')}
   ${rb.map(x=>L(`${n(x)} <span class="fine">rushing</span>`,`${x.s.car} car · ${x.s.ry} yds · ${x.s.rtd} TD`)).join('')}
   ${rc.map(x=>L(`${n(x)} <span class="fine">receiving</span>`,`${x.s.rec} rec · ${x.s.yds} yds${x.s.tdr?' · '+x.s.tdr+' TD':''}`)).join('')}
   ${df.map(x=>L(`${n(x)} <span class="fine">defense</span>`,[x.s.tk?x.s.tk+' tkl':'',x.s.sk?x.s.sk+' sack'+(x.s.sk>1?'s':''):'',x.s.pi?x.s.pi+' INT':''].filter(Boolean).join(' · '))).join('')}
  </div>`;
}
function tourney(){
  const r=S.br.rounds,semi=r[0],fin=r[1]?.[0],dn=S.phase==='done',g=S.box,need=S.br.need;
  const out=!dn&&(semi.some(s=>done(s)&&(s.a===S.me||s.b===S.me)&&winner(s)!==S.me)||fin&&done(fin)&&winner(fin)!==S.me);
  const champ=dn?S.teams[S.champ]:null;
  app.innerHTML=`<section class="band">
   <h1 style="margin-bottom:14px">${dn?(S.champ===S.me?'You won the title.':esc(champ.name)+' won the title.'):fin?'The championship game':'Semifinals'}</h1>
   <div class="bk">
    <div class="col">${serBox(semi[0],'1 vs 4')}${serBox(semi[1],'2 vs 3')}</div>
    <div class="col">${serBox(fin,'Championship')}</div>
    <div class="champ"><svg class="trophy" viewBox="0 0 84 110" aria-hidden="true"><defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#9aa1ab"/></linearGradient></defs><path d="M38 70 L40 34 L44 34 L46 70z" fill="url(#gd)"/><g transform="rotate(-35 42 24)"><ellipse cx="42" cy="24" rx="20" ry="12" fill="url(#gd)"/><path d="M30 24h24M35 21v6M39 21v6M43 21v6M47 21v6" stroke="#6b7280" stroke-width="1.4"/></g><path d="M30 70h24l4 16H26z" fill="#c8ccd2"/><rect x="20" y="86" width="44" height="16" rx="3" fill="#2a2e37"/></svg>
     <div class="tn cond" style="font-size:22px;font-weight:800">${champ?esc(champ.name):'Champion'}</div><div class="sd" style="font-size:13px;color:#9aa1ab">${need===1?'Single elimination':'Best of '+S.series}</div></div>
   </div>
   <div class="ctl">${dn?`<button class="btn" id="again">Draft again</button>`:`<button class="btn" id="next">${need===1?'Play the next round':'Play next game'}</button>${need>1?'<button class="btn ghost" id="rest">Sim to end of round</button>':''}<button class="btn ghost" id="end">Sim to end</button>`}${out?`<span class="fine" style="align-self:center">You're out. Keep playing to see who wins.</span>`:''}</div>
   ${g?`<div class="final"><span>${esc(S.teams[g.t[0]].name)} ${g.sc[0]}</span><span class="fine">vs</span><span>${esc(S.teams[g.t[1]].name)} ${g.sc[1]}</span>${g.ot?`<span class="tag">OT</span>`:''}</div><div class="box">${boxCol(g,0)}${boxCol(g,1)}</div>`:`<p class="fine">${need===1?'One game per round. Lose and you are out.':`First to ${need} wins advances.`} The box score shows the latest game involving your team.${S.mode==='off'?' Both offenses face the same stand-in defense.':S.mode==='def'?' Both defenses face the same stand-in offense, so each team\'s score is what its stand-in offense put up against the other defense.':''}</p>`}
  </section>
  <section class="band" style="padding-top:0"><h2 style="margin-bottom:12px">Rosters</h2><div class="teams" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">${S.teams.map(teamCard).join('')}</div></section>`;
}

window.claude?.hot?.snapshot?.(()=>S);
function start(d){if(d&&d.phase)S=d;tick()}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}</script>
</body></html>
